<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap | AgroSense</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:    #070a06;
            --gold:  #c8a96a;
            --cream: #ede8d8;
            --card:  #111a0e;
            --input: #0d1209;
        }

        html, body {
            height: 100%;
            font-family: 'Jost', sans-serif;
            font-weight: 300;
            background: var(--bg);
            color: var(--cream);
            overflow: hidden;
        }

        .split {
            display: flex;
            height: 100vh;
        }

        /* ── Left Panel ── */
        .left-panel {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: none;
        }
        @media (min-width: 768px) { .left-panel { display: block; } }

        .left-bg {
            position: absolute;
            inset: 0;
            background-image: url('https://images.unsplash.com/photo-1542601906990-b4d3fb778b09?w=1800&q=90');
            background-size: cover;
            background-position: center;
            transform: scale(1.05);
            transition: transform 8s ease;
        }
        .left-bg.zoomed { transform: scale(1); }

        .left-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                135deg,
                rgba(7,10,6,.88) 0%,
                rgba(7,10,6,.55) 50%,
                rgba(7,10,6,.8) 100%
            );
        }

        .left-content {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 56px 52px;
        }

        .left-leaf {
            position: absolute;
            top: 48px;
            left: 52px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .left-leaf svg { width: 38px; height: 38px; }
        .left-leaf-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 22px;
            font-weight: 600;
            color: var(--gold);
            letter-spacing: .04em;
        }

        .left-quote {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: clamp(28px, 3.2vw, 42px);
            font-weight: 300;
            color: var(--cream);
            line-height: 1.35;
            margin-bottom: 20px;
            max-width: 520px;
            text-shadow: 0 2px 24px rgba(0,0,0,.5);
        }
        .left-quote-line {
            display: block;
            width: 48px;
            height: 1px;
            background: var(--gold);
            margin-bottom: 18px;
            opacity: .7;
        }
        .left-quote-attr {
            font-size: 13px;
            color: rgba(237,232,216,.45);
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        /* ── Right Panel ── */
        .right-panel {
            width: 100%;
            max-width: 480px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 32px;
            background: var(--bg);
            position: relative;
            overflow-y: auto;
        }
        @media (min-width: 768px) {
            .right-panel {
                background: rgba(13,18,9,.75);
                backdrop-filter: blur(16px);
                border-left: 1px solid rgba(200,169,106,.1);
            }
        }

        .right-inner {
            width: 100%;
            max-width: 360px;
        }

        .auth-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 36px;
        }
        .auth-logo svg { width: 40px; height: 40px; }
        .auth-logo-name {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 28px;
            font-weight: 600;
            color: var(--gold);
        }

        .auth-heading {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            font-weight: 400;
            color: var(--cream);
            margin-bottom: 6px;
        }
        .auth-sub {
            font-size: 14px;
            color: rgba(237,232,216,.45);
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 18px;
        }
        .form-label {
            display: block;
            font-size: 11px;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: rgba(237,232,216,.5);
            margin-bottom: 8px;
        }
        .form-input {
            width: 100%;
            background: var(--input);
            border: 1px solid rgba(200,169,106,.2);
            border-radius: 6px;
            padding: 12px 14px;
            font-family: 'Jost', sans-serif;
            font-size: 14px;
            font-weight: 300;
            color: var(--cream);
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }
        .form-input::placeholder { color: rgba(237,232,216,.25); }
        .form-input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(200,169,106,.08);
        }

        .remember-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
        }
        .remember-row input[type="checkbox"] {
            width: 15px; height: 15px;
            accent-color: var(--gold);
            cursor: pointer;
        }
        .remember-row label {
            font-size: 13px;
            color: rgba(237,232,216,.5);
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background: rgba(200,169,106,.12);
            border: 1px solid rgba(200,169,106,.7);
            border-radius: 6px;
            font-family: 'Jost', sans-serif;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: .06em;
            color: var(--cream);
            cursor: pointer;
            transition: background .2s, border-color .2s, transform .15s;
            position: relative;
            overflow: hidden;
        }
        .btn-submit:hover {
            background: rgba(200,169,106,.22);
            border-color: var(--gold);
            transform: translateY(-1px);
        }
        .btn-submit:active { transform: translateY(0); }
        .btn-submit:disabled { opacity: .5; cursor: not-allowed; transform: none; }

        .btn-loader {
            display: none;
            width: 16px; height: 16px;
            border: 2px solid rgba(237,232,216,.3);
            border-top-color: var(--cream);
            border-radius: 50%;
            animation: spin .7s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-msg {
            display: none;
            background: rgba(239,68,68,.12);
            border: 1px solid rgba(239,68,68,.3);
            border-radius: 6px;
            padding: 11px 14px;
            font-size: 13px;
            color: #fca5a5;
            margin-bottom: 18px;
        }
        .error-msg.show { display: block; }

        @keyframes shake {
            0%,100% { transform: translateX(0); }
            20%      { transform: translateX(-8px); }
            40%      { transform: translateX(8px); }
            60%      { transform: translateX(-5px); }
            80%      { transform: translateX(5px); }
        }
        .shake { animation: shake .4s ease; }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(200,169,106,.15);
        }
        .divider span {
            font-size: 11px;
            color: rgba(237,232,216,.3);
            letter-spacing: .08em;
        }

        .auth-links {
            text-align: center;
        }
        .auth-links a {
            color: var(--gold);
            text-decoration: none;
            font-size: 13.5px;
            transition: opacity .2s;
        }
        .auth-links a:hover { opacity: .75; }
        .auth-links .back-link {
            display: block;
            margin-top: 16px;
            font-size: 12px;
            color: rgba(237,232,216,.35);
        }
        .auth-links .back-link:hover { color: rgba(237,232,216,.6); }

        /* Particles */
        .particle {
            position: fixed;
            width: 2px; height: 2px;
            background: var(--gold);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            animation: float-up linear infinite;
        }
        @keyframes float-up {
            0%   { opacity: 0; transform: translateY(0) scale(1); }
            10%  { opacity: .5; }
            90%  { opacity: .2; }
            100% { opacity: 0; transform: translateY(-80px) scale(.3); }
        }
        body{cursor:none}
        #cursor{position:fixed;width:28px;height:28px;pointer-events:none;transform:translate(-50%,-50%) rotate(-25deg);transition:transform .15s ease-out;z-index:9999;top:0;left:0}
        #cursor.hover{transform:translate(-50%,-50%) rotate(-25deg) scale(1.6)}
        .iz{position:fixed;width:14px;height:14px;pointer-events:none;opacity:.7;animation:leaf-trail 1.8s ease-in forwards;z-index:9998}
        @keyframes leaf-trail{0%{opacity:.7;transform:translate(-50%,-50%) rotate(0)}100%{opacity:0;transform:translate(-50%,calc(-50% + 60px)) rotate(180deg)}}
    </style>
</head>
<body>
<svg id="cursor" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="M16 2 C8 6, 4 14, 6 24 C6 26, 8 28, 10 28 C20 28, 28 20, 30 8 C30 6, 28 4, 26 4 C22 4, 18 4, 16 2 Z" fill="#639922" stroke="#3B6D11" stroke-width="0.8"/><path d="M14 26 C16 20, 20 14, 28 8" stroke="#3B6D11" stroke-width="0.8" fill="none"/></svg>

<div class="split">
    <!-- Left cinematic panel -->
    <div class="left-panel">
        <div class="left-bg" id="leftBg"></div>
        <div class="left-overlay"></div>
        <div class="left-content">
            <div class="left-leaf">
                <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20 4C20 4 6 10 6 22C6 30 12.5 35 20 35C27.5 35 34 30 34 22C34 10 20 4 20 4Z" fill="none" stroke="#c8a96a" stroke-width="1.5"/>
                    <path d="M20 4C20 4 26 14 26 22" stroke="#c8a96a" stroke-width="1" stroke-dasharray="2 2" opacity=".6"/>
                    <path d="M20 35L20 38" stroke="#c8a96a" stroke-width="1.5" stroke-linecap="round"/>
                    <circle cx="20" cy="22" r="2" fill="#c8a96a" opacity=".5"/>
                </svg>
                <span class="left-leaf-name">AgroSense</span>
            </div>

            <blockquote class="left-quote">
                "Toprağı tanımak,<br>zamanı tanımaktır."
            </blockquote>
            <span class="left-quote-line"></span>
            <span class="left-quote-attr">AgroSense — Akıllı Tarım Platformu</span>
        </div>
    </div>

    <!-- Right auth panel -->
    <div class="right-panel">
        <div class="right-inner">
            <div class="auth-logo">
                <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20 4C20 4 6 10 6 22C6 30 12.5 35 20 35C27.5 35 34 30 34 22C34 10 20 4 20 4Z" fill="none" stroke="#c8a96a" stroke-width="1.5"/>
                    <path d="M20 4C20 4 26 14 26 22" stroke="#c8a96a" stroke-width="1" stroke-dasharray="2 2" opacity=".6"/>
                    <path d="M20 35L20 38" stroke="#c8a96a" stroke-width="1.5" stroke-linecap="round"/>
                    <circle cx="20" cy="22" r="2" fill="#c8a96a" opacity=".5"/>
                </svg>
                <span class="auth-logo-name">AgroSense</span>
            </div>

            <h1 class="auth-heading">Giriş Yap</h1>
            <p class="auth-sub">Hesabına erişmek için bilgilerini gir.</p>

            <div class="error-msg" id="error-msg"></div>

            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label" for="email">E-posta</label>
                    <input class="form-input" type="email" id="email" name="email"
                           placeholder="ornek@mail.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Şifre</label>
                    <input class="form-input" type="password" id="password" name="password"
                           placeholder="••••••••" required autocomplete="current-password">
                </div>
                <div class="remember-row">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Beni hatırla</label>
                </div>

                <button type="submit" class="btn-submit" id="submit-btn">
                    <span id="btn-text">Giriş Yap</span>
                    <div class="btn-loader" id="btn-loader"></div>
                </button>
            </form>

            <div class="divider"><span>ya da</span></div>

            <div class="auth-links">
                <a href="/register">Hesabın yok mu? Üye ol →</a>
                <a href="/" class="back-link">← Ana Sayfaya Dön</a>
            </div>
        </div>
    </div>
</div>

<script>
// Zoom in bg slowly
setTimeout(() => {
    const bg = document.getElementById('leftBg');
    if (bg) bg.classList.add('zoomed');
}, 100);

// Subtle floating particles
function spawnParticle() {
    const p = document.createElement('div');
    p.className = 'particle';
    const x = Math.random() * window.innerWidth * 0.4;
    const dur = 4 + Math.random() * 5;
    p.style.cssText = `left:${x}px;bottom:0;animation-duration:${dur}s;animation-delay:${Math.random()*2}s;`;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), dur * 1000 + 2000);
}
setInterval(spawnParticle, 1200);

async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const loader = document.getElementById('btn-loader');
    const errEl = document.getElementById('error-msg');

    // Loading state
    btn.disabled = true;
    btnText.style.display = 'none';
    loader.style.display = 'block';
    errEl.classList.remove('show');

    const form = e.target;
    const data = new FormData(form);

    try {
        const res = await fetch('/login', {
            method: 'POST',
            body: data,
        });
        const json = await res.json();

        if (res.ok && json.success) {
            btnText.textContent = '✓ Başarılı!';
            btnText.style.display = 'block';
            loader.style.display = 'none';
            setTimeout(() => {
                window.location.replace(json.redirect || '/dashboard');
            }, 400);
        } else {
            showError(json.error || 'Bir hata oluştu.');
        }
    } catch(err) {
        showError('Sunucuya bağlanılamadı. Lütfen tekrar deneyin.');
    }
}

function showError(msg) {
    const errEl = document.getElementById('error-msg');
    const btn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const loader = document.getElementById('btn-loader');

    errEl.textContent = msg;
    errEl.classList.add('show');
    errEl.classList.remove('shake');
    void errEl.offsetWidth;
    errEl.classList.add('shake');

    btn.disabled = false;
    loader.style.display = 'none';
    btnText.style.display = 'block';
}
</script>
<script>(function(){var c=document.getElementById('cursor');if(!c)return;document.addEventListener('mousemove',function(e){c.style.left=e.clientX+'px';c.style.top=e.clientY+'px';if(Math.random()<.12){var iz=c.cloneNode(true);iz.classList.add('iz');iz.removeAttribute('id');iz.style.left=e.clientX+'px';iz.style.top=e.clientY+'px';document.body.appendChild(iz);setTimeout(function(){iz.remove()},1800);}},{passive:true});document.querySelectorAll('a,button').forEach(function(el){el.addEventListener('mouseenter',function(){c.classList.add('hover')});el.addEventListener('mouseleave',function(){c.classList.remove('hover')});});})();</script>
</body>
</html>
