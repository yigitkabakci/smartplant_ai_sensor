<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Üye Ol | AgroSense</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:    #070a06;
            --gold:  #c8a96a;
            --cream: #ede8d8;
            --card:  #111a0e;
            --input: #0d1209;
        }

        html, body {
            height: 100%;
            font-family: 'Jost', sans-serif;
            font-weight: 300;
            background: var(--bg);
            color: var(--cream);
        }

        .split {
            display: flex;
            min-height: 100vh;
        }

        /* ── Left Panel ── */
        .left-panel {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: none;
        }
        @media (min-width: 768px) { .left-panel { display: block; } }

        .left-bg {
            position: absolute;
            inset: 0;
            background-image: url('https://images.unsplash.com/photo-1585652757141-5e29d77e285d?w=1800&q=90');
            background-size: cover;
            background-position: center 30%;
            transform: scale(1.05);
            transition: transform 8s ease;
        }
        .left-bg.zoomed { transform: scale(1); }

        .left-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                135deg,
                rgba(7,10,6,.90) 0%,
                rgba(7,10,6,.58) 50%,
                rgba(7,10,6,.82) 100%
            );
        }

        .left-content {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 56px 52px;
        }

        .left-leaf {
            position: absolute;
            top: 48px;
            left: 52px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .left-leaf svg { width: 38px; height: 38px; }
        .left-leaf-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 22px;
            font-weight: 600;
            color: var(--gold);
            letter-spacing: .04em;
        }

        .left-quote {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: clamp(24px, 2.8vw, 38px);
            font-weight: 300;
            color: var(--cream);
            line-height: 1.4;
            margin-bottom: 20px;
            max-width: 520px;
            text-shadow: 0 2px 24px rgba(0,0,0,.5);
        }
        .left-quote-line {
            display: block;
            width: 48px;
            height: 1px;
            background: var(--gold);
            margin-bottom: 18px;
            opacity: .7;
        }
        .left-quote-attr {
            font-size: 13px;
            color: rgba(237,232,216,.45);
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        /* ── Right Panel ── */
        .right-panel {
            width: 100%;
            max-width: 480px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 32px;
            background: var(--bg);
            position: relative;
            overflow-y: auto;
        }
        @media (min-width: 768px) {
            .right-panel {
                background: rgba(13,18,9,.75);
                backdrop-filter: blur(16px);
                border-left: 1px solid rgba(200,169,106,.1);
            }
        }

        .right-inner {
            width: 100%;
            max-width: 360px;
            padding: 20px 0;
        }

        .auth-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
        }
        .auth-logo svg { width: 36px; height: 36px; }
        .auth-logo-name {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 26px;
            font-weight: 600;
            color: var(--gold);
        }

        .auth-heading {
            font-family: 'Cormorant Garamond', serif;
            font-size: 30px;
            font-weight: 400;
            color: var(--cream);
            margin-bottom: 6px;
        }
        .auth-sub {
            font-size: 13px;
            color: rgba(237,232,216,.45);
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 16px;
        }
        .form-label {
            display: block;
            font-size: 11px;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: rgba(237,232,216,.5);
            margin-bottom: 7px;
        }
        .form-input {
            width: 100%;
            background: var(--input);
            border: 1px solid rgba(200,169,106,.2);
            border-radius: 6px;
            padding: 11px 14px;
            font-family: 'Jost', sans-serif;
            font-size: 14px;
            font-weight: 300;
            color: var(--cream);
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }
        .form-input::placeholder { color: rgba(237,232,216,.25); }
        .form-input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(200,169,106,.08);
        }
        .form-input.invalid {
            border-color: rgba(239,68,68,.6);
        }

        .password-hint {
            font-size: 11px;
            color: rgba(237,232,216,.3);
            margin-top: 5px;
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background: rgba(200,169,106,.12);
            border: 1px solid rgba(200,169,106,.7);
            border-radius: 6px;
            font-family: 'Jost', sans-serif;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: .06em;
            color: var(--cream);
            cursor: pointer;
            transition: background .2s, border-color .2s, transform .15s;
            margin-top: 8px;
        }
        .btn-submit:hover {
            background: rgba(200,169,106,.22);
            border-color: var(--gold);
            transform: translateY(-1px);
        }
        .btn-submit:active { transform: translateY(0); }
        .btn-submit:disabled { opacity: .5; cursor: not-allowed; transform: none; }

        .btn-loader {
            display: none;
            width: 16px; height: 16px;
            border: 2px solid rgba(237,232,216,.3);
            border-top-color: var(--cream);
            border-radius: 50%;
            animation: spin .7s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-msg {
            display: none;
            background: rgba(239,68,68,.12);
            border: 1px solid rgba(239,68,68,.3);
            border-radius: 6px;
            padding: 11px 14px;
            font-size: 13px;
            color: #fca5a5;
            margin-bottom: 16px;
        }
        .error-msg.show { display: block; }

        @keyframes shake {
            0%,100% { transform: translateX(0); }
            20%      { transform: translateX(-8px); }
            40%      { transform: translateX(8px); }
            60%      { transform: translateX(-5px); }
            80%      { transform: translateX(5px); }
        }
        .shake { animation: shake .4s ease; }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 22px 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(200,169,106,.15);
        }
        .divider span {
            font-size: 11px;
            color: rgba(237,232,216,.3);
            letter-spacing: .08em;
        }

        .auth-links {
            text-align: center;
        }
        .auth-links a {
            color: var(--gold);
            text-decoration: none;
            font-size: 13.5px;
            transition: opacity .2s;
        }
        .auth-links a:hover { opacity: .75; }
        .auth-links .back-link {
            display: block;
            margin-top: 14px;
            font-size: 12px;
            color: rgba(237,232,216,.35);
        }
        .auth-links .back-link:hover { color: rgba(237,232,216,.6); }

        /* Password strength bar */
        .strength-wrap {
            margin-top: 7px;
            height: 3px;
            background: rgba(200,169,106,.1);
            border-radius: 2px;
            overflow: hidden;
        }
        .strength-bar {
            height: 100%;
            width: 0;
            border-radius: 2px;
            transition: width .3s, background .3s;
        }
    </style>
</head>
<body>

<div class="split">
    <!-- Left cinematic panel -->
    <div class="left-panel">
        <div class="left-bg" id="leftBg"></div>
        <div class="left-overlay"></div>
        <div class="left-content">
            <div class="left-leaf">
                <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20 4C20 4 6 10 6 22C6 30 12.5 35 20 35C27.5 35 34 30 34 22C34 10 20 4 20 4Z" fill="none" stroke="#c8a96a" stroke-width="1.5"/>
                    <path d="M20 4C20 4 26 14 26 22" stroke="#c8a96a" stroke-width="1" stroke-dasharray="2 2" opacity=".6"/>
                    <path d="M20 35L20 38" stroke="#c8a96a" stroke-width="1.5" stroke-linecap="round"/>
                    <circle cx="20" cy="22" r="2" fill="#c8a96a" opacity=".5"/>
                </svg>
                <span class="left-leaf-name">AgroSense</span>
            </div>

            <blockquote class="left-quote">
                "Bir tohum, kök salacağı<br>toprağı seçemez.<br>Ama sen seçebilirsin."
            </blockquote>
            <span class="left-quote-line"></span>
            <span class="left-quote-attr">AgroSense — Geleceğin Tarımı</span>
        </div>
    </div>

    <!-- Right auth panel -->
    <div class="right-panel">
        <div class="right-inner">
            <div class="auth-logo">
                <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20 4C20 4 6 10 6 22C6 30 12.5 35 20 35C27.5 35 34 30 34 22C34 10 20 4 20 4Z" fill="none" stroke="#c8a96a" stroke-width="1.5"/>
                    <path d="M20 4C20 4 26 14 26 22" stroke="#c8a96a" stroke-width="1" stroke-dasharray="2 2" opacity=".6"/>
                    <path d="M20 35L20 38" stroke="#c8a96a" stroke-width="1.5" stroke-linecap="round"/>
                    <circle cx="20" cy="22" r="2" fill="#c8a96a" opacity=".5"/>
                </svg>
                <span class="auth-logo-name">AgroSense</span>
            </div>

            <h1 class="auth-heading">Aramıza Katıl</h1>
            <p class="auth-sub">Ücretsiz hesap oluştur, bitkilerini izlemeye başla.</p>

            <div class="error-msg" id="error-msg"></div>

            <form id="register-form" onsubmit="handleRegister(event)" novalidate>
                <div class="form-group">
                    <label class="form-label" for="name">Ad Soyad</label>
                    <input class="form-input" type="text" id="name" name="name"
                           placeholder="Ahmet Yılmaz" required autocomplete="name">
                </div>
                <div class="form-group">
                    <label class="form-label" for="email">E-posta</label>
                    <input class="form-input" type="email" id="email" name="email"
                           placeholder="ornek@mail.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Şifre</label>
                    <input class="form-input" type="password" id="password" name="password"
                           placeholder="En az 6 karakter" required autocomplete="new-password"
                           oninput="checkStrength(this.value)">
                    <div class="strength-wrap"><div class="strength-bar" id="strength-bar"></div></div>
                    <p class="password-hint">En az 6 karakter kullanın.</p>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password2">Şifre Tekrar</label>
                    <input class="form-input" type="password" id="password2" name="password2"
                           placeholder="Şifreyi tekrar girin" required autocomplete="new-password">
                </div>

                <button type="submit" class="btn-submit" id="submit-btn">
                    <span id="btn-text">Aramıza Katıl</span>
                    <div class="btn-loader" id="btn-loader"></div>
                </button>
            </form>

            <div class="divider"><span>zaten üyeyim</span></div>

            <div class="auth-links">
                <a href="/login">Zaten hesabın var mı? Giriş yap →</a>
                <a href="/" class="back-link">← Ana Sayfaya Dön</a>
            </div>
        </div>
    </div>
</div>

<script>
// Zoom in bg
setTimeout(() => {
    const bg = document.getElementById('leftBg');
    if (bg) bg.classList.add('zoomed');
}, 100);

function checkStrength(val) {
    const bar = document.getElementById('strength-bar');
    let score = 0;
    if (val.length >= 6)  score++;
    if (val.length >= 10) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^a-zA-Z0-9]/.test(val)) score++;

    const pct = Math.min(100, score * 20);
    bar.style.width = pct + '%';
    if (score <= 1) bar.style.background = '#ef4444';
    else if (score <= 2) bar.style.background = '#f59e0b';
    else if (score <= 3) bar.style.background = '#84cc16';
    else bar.style.background = '#22c55e';
}

async function handleRegister(e) {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const loader = document.getElementById('btn-loader');
    const errEl = document.getElementById('error-msg');
    const pw = document.getElementById('password').value;
    const pw2 = document.getElementById('password2').value;

    // Client-side validation
    if (pw !== pw2) { showError('Şifreler eşleşmiyor.'); return; }
    if (pw.length < 6) { showError('Şifre en az 6 karakter olmalı.'); return; }

    btn.disabled = true;
    btnText.style.display = 'none';
    loader.style.display = 'block';
    errEl.classList.remove('show');

    const data = new FormData(e.target);
    try {
        const res = await fetch('/register', { method: 'POST', body: data });
        const json = await res.json();

        if (res.ok && json.success) {
            btnText.textContent = '✓ Hesap Oluşturuldu!';
            btnText.style.display = 'block';
            loader.style.display = 'none';
            setTimeout(() => {
                window.location.href = json.redirect || '/dashboard';
            }, 500);
        } else {
            showError(json.error || 'Bir hata oluştu.');
        }
    } catch(err) {
        showError('Sunucuya bağlanılamadı. Lütfen tekrar deneyin.');
    }
}

function showError(msg) {
    const errEl = document.getElementById('error-msg');
    const btn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const loader = document.getElementById('btn-loader');

    errEl.textContent = msg;
    errEl.classList.add('show');
    errEl.classList.remove('shake');
    void errEl.offsetWidth;
    errEl.classList.add('shake');

    btn.disabled = false;
    loader.style.display = 'none';
    btnText.style.display = 'block';
}
</script>
</body>
</html>
